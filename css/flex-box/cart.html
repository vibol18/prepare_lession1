
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cart {
            border: 1px solid black;
            width: 400px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cart .cart-container {
            width: 90%;
            height: 90%;

            border: 1px solid black;
            border-radius: 10px;
        }

        .cart-items {
            display: flex;
            flex-direction: column;

            width: 90%;
            height: 90%;

            gap: 20px;

            margin: auto;

            justify-content: center;
            align-items: center;
        }

        .cart-items .cart-image {
            background-color: gray;

            width: 90%;
            height: 60%;

            border-radius: 15px;
        }

        .product-info {
            width: 90%;

            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 30px;
            gap: 10px;
        }

        .product-info .addtoCart {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="cart">

        <div class="cart-container">

            <div class="cart-items">

                <div class="cart-image">
                </div>

                <div class="product-info">
                    <h3 class="product-name">
                        Wireless Headphone
                    </h3>
                    <button class="addtoCart">
                        Add To Cart
                    </button>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
