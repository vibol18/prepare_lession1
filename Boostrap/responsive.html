<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="bg-white">
        <div class="container mb-4 m-auto">
            <div class="row row-cols-3 row-cols-sm-5 gap-2 justify-content-center">
                <div class="card ">
                    <img src="https://media.istockphoto.com/id/488160041/photo/mens-shirt.jpg?s=612x612&w=0&k=20&c=xVZjKAUJecIpYc_fKRz_EB8HuRmXCOOPOtZ-ST6eFvQ="
                        class="card-img-top" alt="">
                    <div class="cart-body">
                        <div class="cart-title"> Helo</div>
                    </div>
                </div>

                <div class="col">
                    <div class="card h-100 shadow-sm">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTimiyRhUtYbVmhIHZlxHW2FCe6zKTAN2rUQn_ck8-HoOi9UTFXnz8hv8o&s=10"
                            class="card-img-top" alt="Wireless headphones">
                        <div class="card-body">
                            <h5 class="card-title">Wireless Headphones</h5>
                            <p class="card-text">$35.00</p>
                            <button class="btn btn-primary w-100">Buy Now</button>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxP7JvN7aUiVMdtoLLiEokLl_1qJc95r9ucjiX_xrxXA&s"
                            class="card-img-top" alt="">
                        <div class="cart-body">
                            <div class="cart-title">Sport Shoe</div>
                        </div>

                    </div>
                </div>

                <div class="col">
                    <div class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsuHAJCW-qz5sZZQS8fORe9zNEXzjZm9WTJerrJwOx1A&s=10"
                            class="card-img-top" alt="">
                        <div class="card-title">Headport Blutooth </div>
                        <div class="card-text">$42.55</div>
                    </div>
                </div>

                <div class="col">
                    <div class="cart">
                        <img src="" class="card-img-top" alt="">
                        <div class="cart-body">
                            <div class="card-text">$190.54</div>
                        </div>
                    </div>
                </div>
                <div class="card" style="width: 18rem;">
                    <div class="card-body">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsuHAJCW-qz5sZZQS8fORe9zNEXzjZm9WTJerrJwOx1A&s=10"
                            class="card-img" alt="...">
                        <h5 class="mt-2 mb-0">Image within the body</h5>
                        <p class="card-text fg-2">Some quick example text to build on the card title and make up the
                            bulk of the card’s content.</p>
                        <small class="fg-3">Last updated 3 mins ago</small>
                        <button class="w-100 btn btn-info">Add To cart</button>
                    </div>
                </div>


            </div>
        </div>
    </div>
</body>

</html>
