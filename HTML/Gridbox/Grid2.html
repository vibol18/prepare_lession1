<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
     .container{
        display: grid;
        grid-template-columns: 1fr 1fr; 
        column-gap: 20px;  
        row-gap: 20px;
    }
    .box{
        background-color: rgb(255, 0, 0);
        padding: 100px;
    }
    .box-full{
        background-color: rebeccapurple;
        padding: 100px;
        height: 100px;
        grid-column: 1/3;
    }
   </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
         <div class="box"></div>
          <div class="box"></div>
           <div class="box"></div>
        <div class="box-full">Hello</div>
    </div>
</body>
</html>
