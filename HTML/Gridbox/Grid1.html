<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: azure;
        }
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr ;
            gap: 10px;
            
        }
        .header{
            background-color: rgb(7, 176, 7);
            padding: 30px;
            grid-column: 1/3;
            box-shadow: 0px 0px 20px 1px rgb(42, 96, 42);
            border-radius: 13px;

        }
        .sidebar{
            grid-row: 2;
            padding: 30px;
            background: blueviolet;
        }
        .content1{
            grid-column: 1/3;
            background-color: blue;
            padding: 30px;
        }
        .section{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-row: 2/2;
            gap: 10px;
        }
        .content2{
            background: brown;
            padding: 30px;   
        }
        .content3{
            padding: 30px;
            background-color: rgb(245, 248, 247);
             box-shadow: 0 0 1px 1px black;
        }
        .footer{
            grid-row: 3;
            grid-column: 1/3;
            padding: 30px;
            background-color: white;
            box-shadow: 0px 1px 20px 2px rgb(205, 203, 203);
            border-radius: 10px;
        }
        .footer:hover{

        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">header</div>
        <div class="sidebar">Sidebar</div>
        
        <div class="section">
            <div class="content1">Content1</div>
            <div class="content2">Content2</div>
            <div class="content3">Content3</div>
        </div>
        <footer class="footer">fotter</footer>
    </div>
</body>
</html>
