<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
        }

        .navbar {
            height: 60px;
            background-color: #333;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
           
            padding: 0 20px;
        }

        .layout {
            display: flex;
            min-height: calc(100vh - 60px);
        }

        aside {
            width: 200px;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
           
        }
        .body {
            flex: 1;
            background-color: #f2f2f2;
            padding: 20px;
        }

        footer {
            height: 50px;
            background-color: #333;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h2>My Website</h2>
        <p>Profile</p>
    </nav>

    <div class="layout">

        <aside class="" >
            <h3>dashborad</h3>
        </aside>
        <main class="body">
            <h1>Dashboard</h1>
            <p>Main content goes here.</p>
        </main>

    </div>
</body>

</html>
