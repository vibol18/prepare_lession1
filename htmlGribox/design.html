<style>
    * {
        padding: 0;

        box-sizing: border-box;

    .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        box-shadow: 1px 1px 0px 1px;
        padding-top: 10px;
        height: 60px;
        position: fixed;
        width: 100%;

    }

    .menu {
        display: flex;
        gap: 20px;
        font-weight: bold;
        list-style-type: none;
        margin-left: 30px;

    }

    .menu a {
        text-decoration: none;
        cursor: pointer;
        color: black;
        font-size: 20px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .logo img {
        width: 120px;
    }

    .icon {
        display: flex;
        gap: 20px;
        margin-right: 30px;
        cursor: pointer;
        align-items: center;
    }

    .icon img {
        width: 20px;
        height: 20px;
        border-radius: 50%;
    }

    .icon .search {
        height: 25px;
        border-radius: 5px;
        box-shadow: 1px 0px 1px 1px;

        border: none;
    }

    .bottom-nav {
        display: flex;
        height: 30px;
        box-shadow: 1px 1px 2px;
        position: fixed;
        width: 100%;
        margin-top: 60px;
    }

    .bottom-nav select {
        border: none;
        background: none;
        margin-left: 30px;
        font-size: 15px;
    }

    .category {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 10px;
        margin-left: 10px;
    }

    .category .filter {
        display: flex;
        gap: 5px;
    }

    .category select {
        height: 35px;
        border: none;
        width: 80px;
        border-radius: 4px;
    }

    .category-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .category-content .select {

        border: none;
        height: 30px;
        margin-right: 20px;
    }

    .product-conatiner {
        display: grid;
          grid-template-columns: repeat(4, 400px);
        justify-content: center;
        column-gap: 20px;
        row-gap: 20px;
        align-items: center;
        margin-top: 40px;
    }

    .product-conatiner .product-cart {
        width: 300px;
    }


   .product-conatiner .product-cart img {
    width: 100%;
    height: auto;
    object-fit: cover;
}
    .product-cart button{
        background-color: gray;
        height: 30px;
        border: none;
        width: 70px;
        box-shadow: 1px 1px 2px 1px;
    }   

    @media (max-width: 650px) {
    .product-conatiner {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 20px 10px;
    }

    .product-cart img {
        height: auto;
    }

    .menu {
        display: none;
    }
}
